sonar.projectKey=event-ticketing-system-api
sonar.projectName=event-ticketing-system-api
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=backend
sonar.tests=backend/account/tests,backend/event/tests,backend/transaction/tests,backend/ticket/tests

sonar.exclusions=**/migrations/**,**/__pycache__/**,**/.pytest_cache/**,**/tests/**,docs/**,scripts/**
sonar.test.inclusions=backend/**/tests/**/*.py
sonar.cpd.exclusions=backend/**/app/main.py,backend/**/app/core/dependencies.py

# Enable after generating coverage.xml from pytest-cov.
