apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      serviceAccountName: cloud-sql-proxy-sa
      containers:
        - name: ticket-api
          image: asia-east1-docker.pkg.dev/ticketing-system-260607/app-repo/api:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SERVICE
              value: "ticket"
            - name: ENV
              value: "gke"
            - name: TICKET_DB_HOST
              value: "127.0.0.1"
            - name: TICKET_DB_PORT
              value: "5432"
            - name: TICKET_DB_USER
              value: "postgres"
            - name: TICKET_DB_NAME
              value: "ticket_db"
            - name: TICKET_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ticket-db-password
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service"
            - name: EVENT_SERVICE_URL
              value: "http://event-service"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: jwt-secret-key
            - name: JWT_ALGORITHM
              value: "HS256"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: internal-api-key
        - name: cloud-sql-proxy-ticket
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--structured-logs"
            - "--address=0.0.0.0"
            - "--port=5432"
            - "ticketing-system-260607:asia-east1:ticket-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: default
spec:
  selector:
    app: ticket-service
  ports:
    - port: 80
      targetPort: 8080
