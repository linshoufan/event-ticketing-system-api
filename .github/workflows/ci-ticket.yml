name: CI - Ticket Service

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/ticket/**"
      - "scripts/**"
      - "requirements.txt"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_ticket_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: local
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TICKET_DB_HOST: localhost
      TICKET_DB_PORT: 5435
      TICKET_DB_USER: test
      TICKET_DB_PASSWORD: test
      TICKET_DB_NAME: test_ticket_db
      ACCOUNT_SERVICE_URL: http://localhost:8000
      EVENT_SERVICE_URL: http://localhost:3000
      JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
      JWT_ALGORITHM: HS256
      INTERNAL_API_KEY: ci-test-internal-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend/ticket
        run: ruff check app/ tests/ main.py

      - name: Run migrations
        working-directory: backend/ticket
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend/ticket
        run: pytest tests/ -v --tb=short
